---
layout: default
title: Itens Luna Obscura
description: Visualização dos itens Luna Obscura
---

<style>
    .items-container {
        max-width: 2000px;
        margin: 0 auto;
        padding: 3rem 2rem;
    }

    .back-button-container {
        margin-bottom: 2.5rem;
    }

    .back-button {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        background: var(--bg-card) !important;
        color: var(--accent-primary) !important;
        padding: 0.75rem 1.5rem;
        border-radius: 8px;
        text-decoration: none !important;
        font-weight: 500;
        font-size: 0.95rem;
        border: 1px solid var(--border-primary);
        box-shadow: var(--shadow);
        transition: all 0.3s ease;
    }

    .back-button:hover {
        background: var(--accent-primary) !important;
        color: white !important;
        text-decoration: none !important;
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(88, 166, 255, 0.3);
    }

    .page-header {
        background: var(--bg-card) !important;
        border-radius: 12px;
        padding: 3rem;
        margin-bottom: 3rem;
        border: 1px solid var(--border-primary);
        box-shadow: var(--shadow);
        text-align: center;
    }

    .page-header h1 {
        color: var(--accent-primary) !important;
        font-size: 2.5rem;
        margin-bottom: 0.5rem;
    }

    .page-header p {
        color: var(--text-secondary) !important;
        font-size: 1.1rem;
    }

    .set-section {
        background: var(--bg-card) !important;
        border-radius: 12px;
        padding: 3rem;
        margin-bottom: 3rem;
        border: 1px solid var(--border-primary);
        box-shadow: var(--shadow);
    }

    .set-section h2 {
        color: var(--accent-primary) !important;
        font-size: 2.2rem;
        margin-bottom: 2rem;
        padding-bottom: 1.5rem;
        border-bottom: 2px solid var(--border-primary);
    }

    .items-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
        gap: 2.5rem;
        margin-top: 2rem;
    }

    .item-card {
        background: var(--bg-secondary) !important;
        border-radius: 12px;
        padding: 2rem;
        border: 1px solid var(--border-primary);
        transition: all 0.3s ease;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
    }

    .item-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        border-color: var(--accent-primary);
    }

    .item-image {
        width: 100%;
        max-width: 350px;
        height: auto;
        border-radius: 8px;
        border: 2px solid var(--border-primary);
        background: var(--bg-primary);
        padding: 1rem;
        object-fit: contain;
    }

    .item-name {
        color: var(--text-primary) !important;
        font-size: 1.3rem;
        font-weight: 600;
        text-align: center;
        word-wrap: break-word;
    }

    .standalone-section {
        background: var(--bg-card) !important;
        border-radius: 12px;
        padding: 3rem;
        margin-bottom: 3rem;
        border: 1px solid var(--border-primary);
        box-shadow: var(--shadow);
    }

    .standalone-section h2 {
        color: var(--accent-primary) !important;
        font-size: 2.2rem;
        margin-bottom: 2rem;
        padding-bottom: 1.5rem;
        border-bottom: 2px solid var(--border-primary);
    }

    @media (max-width: 768px) {
        .items-grid {
            grid-template-columns: 1fr;
        }
    }
</style>

<div class="items-container">
    <div class="back-button-container">
        <a href="{{ '/' | relative_url }}" class="back-button">← Voltar para o início</a>
    </div>

    <div class="page-header">
        <h1>🎮 Itens Luna Obscura</h1>
        <p>Visualize os itens disponíveis</p>
    </div>

    <!-- Set Soot-Stained -->
    <div class="set-section">
        <h2>🧹 Set Soot-Stained</h2>
        <div class="items-grid" id="soot-stained-set">
            <!-- Itens serão inseridos via JavaScript -->
        </div>
    </div>

    <!-- Set Madlad/Brawler -->
    <div class="set-section">
        <h2>🍺 Set Madlad/Brawler</h2>
        <div class="items-grid" id="madlad-set">
            <!-- Itens serão inseridos via JavaScript -->
        </div>
    </div>

    <!-- Itens Individuais -->
    <div class="standalone-section">
        <h2>📦 Itens Individuais</h2>
        <div class="items-grid" id="standalone-items">
            <!-- Itens serão inseridos via JavaScript -->
        </div>
    </div>
</div>

<script>
    // Lista de itens organizados por set
    const items = {
        sootStained: [
            { name: "Soot Stained Apron", file: "Soot Stained Apron.PNG" },
            { name: "Soot Stained Uniform", file: "Soot Stained Uniform.PNG" },
            { name: "Soot-Stained Headress", file: "Soot-Stained Headress.PNG" }
        ],
        madlad: [
            { name: "Madlad's Tankard", file: "Madlad's Tankard.PNG" },
            { name: "Brawler's Tankard", file: "Brawler's Tankard.PNG" }
        ],
        standalone: [
            { name: "Belt Whip", file: "Belt Whip.PNG" },
            { name: "Broom Scabbard", file: "Broom Scabbard.PNG" },
            { name: "Broomblade", file: "Broomblade.PNG" },
            { name: "Broomlance", file: "Broomlance.PNG" },
            { name: "Bucket Buckler", file: "Bucket Buckler.PNG" },
            { name: "Chop Chop Chopper", file: "Chop Chop Chopper.PNG" },
            { name: "Corroded Armguard", file: "Corroded Armguard.PNG" },
            { name: "Crimson Bowtie", file: "Crimson Bowtie.PNG" },
            { name: "Drudge Overrals", file: "Drudge Overrals.PNG" },
            { name: "Ecto Reaper", file: "Ecto Reaper.PNG" },
            { name: "Half-Digested Boots", file: "Half-Digested Boots.PNG" },
            { name: "Helping Hand", file: "Helping Hand.PNG" },
            { name: "Knuckle Bucket", file: "Knuckle Bucket.PNG" },
            { name: "Last-Round Boots", file: "Last-Round Boots.PNG" },
            { name: "Mad Drinker Stetson", file: "Mad Drinker Stetson.PNG" },
            { name: "Old Woord 38er", file: "Old Woord 38er.PNG" },
            { name: "Second-Hand Stiletto", file: "Second-Hand Stiletto.PNG" },
            { name: "Sporestring Bow", file: "Sporestring Bow.PNG" },
            { name: "Swallowed Brigandine", file: "Swallowed Brigandine.PNG" },
            { name: "Torn Vest", file: "Torn Vest.PNG" },
            { name: "Twin Seam-Rippers", file: "Twin Seam-Rippers.PNG" },
            { name: "Velvet-Bound Codex", file: "Velvet-Bound Codex.PNG" },
            { name: "Worn Maid Shoes", file: "Worn Maid Shoes.PNG" }
        ]
    };

    // Função para criar o card do item
    function createItemCard(item) {
        const itemId = `item-${item.name.replace(/\s+/g, '-').toLowerCase()}`;
        const baseUrl = '{{ "/luna_items/" | relative_url }}';
        const imagePath = baseUrl + encodeURIComponent(item.file);

        return `
            <div class="item-card" id="${itemId}">
                <img src="${imagePath}" alt="${item.name}" class="item-image" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <div style="display:none; color: var(--text-secondary);">Imagem não encontrada</div>
                <div class="item-name">${item.name}</div>
            </div>
        `;
    }

    // Função para renderizar itens
    function renderItems() {
        const sootStainedContainer = document.getElementById('soot-stained-set');
        const madladContainer = document.getElementById('madlad-set');
        const standaloneContainer = document.getElementById('standalone-items');

        // Renderiza set Soot-Stained
        items.sootStained.forEach(item => {
            sootStainedContainer.innerHTML += createItemCard(item);
        });

        // Renderiza set Madlad/Brawler
        items.madlad.forEach(item => {
            madladContainer.innerHTML += createItemCard(item);
        });

        // Renderiza itens individuais
        items.standalone.forEach(item => {
            standaloneContainer.innerHTML += createItemCard(item);
        });
    }

    // Inicializa quando a página carregar
    document.addEventListener('DOMContentLoaded', renderItems);
</script>
