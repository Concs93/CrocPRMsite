<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Refino — Análise (EV + Distribuição)</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: #121a33;
      --text: #e7ecff;
      --muted: #aab3d6;
      --accent: #7aa2ff;
      --border: rgba(255,255,255,0.12);
    }
    body {
      margin: 0;
      background: radial-gradient(1200px 800px at 20% 0%, #131c3f, var(--bg));
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Liberation Sans", sans-serif;
    }
    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px 16px 40px;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 8px;
      letter-spacing: .2px;
    }
    .sub {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    .card {
      background: rgba(18, 26, 51, 0.7);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      backdrop-filter: blur(6px);
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }
    .controls label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    select, input[type="range"] { width: 100%; }
    select {
      background: rgba(0,0,0,0.2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      outline: none;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      font-size: 12px;
      background: rgba(0,0,0,0.15);
    }
    .kpis {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .kpi {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      background: rgba(0,0,0,0.12);
    }
    .kpi .label {
      font-size: 12px;
      color: var(--muted);
    }
    .kpi .value {
      font-size: 18px;
      margin-top: 6px;
      font-variant-numeric: tabular-nums;
    }
    .materials {
      margin-top: 10px;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
      font-size: 13px;
    }
    th, td {
      padding: 8px 8px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      text-align: left;
    }
    th { color: var(--muted); font-weight: 600; }
    .charts {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    .note {
      color: var(--muted);
      font-size: 12px;
      margin-top: 6px;
      line-height: 1.35;
    }
    @media (max-width: 860px) {
      .controls { grid-template-columns: 1fr; }
      .kpis { grid-template-columns: 1fr; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="wrap">
    <h1>Refino — calculadora</h1>
    <div class="sub">
      Escolha o item, como você vai refinar, e veja uma estimativa de quanto vai gastar pra chegar no refino desejado.
    </div>

    <div class="grid">
      <div class="card">
        <div class="controls">
          <div>
            <label>Tipo do item</label>
            <select id="seriesSelect"></select>
          </div>
          <div>
            <label>Como refinar</label>
            <select id="policySelect">
              <option value="hd">Sempre usar HD (quando existir)</option>
              <option value="threshold50">Alternar pelo % (>=50% usa o que volta, &lt;50% usa o que não volta)</option>
            </select>
          </div>
          <div>
            <label>Refino que você quer chegar</label>
            <div class="row">
              <input id="targetRange" type="range" min="1" max="10" step="1" value="10" />
              <span class="pill" id="targetPill">+10</span>
            </div>
          </div>
          <div>
            <label>Refino atual do item</label>
            <div class="row">
              <input id="startRange" type="range" min="0" max="9" step="1" value="0" />
              <span class="pill" id="startPill">+0</span>
            </div>
          </div>
        </div>

        <div class="kpis">
          <div class="kpi">
            <div class="label">Zeny (estimado)</div>
            <div class="value" id="zenyKpi">—</div>
          </div>
          <div class="kpi">
            <div class="label">Tentativas (estimado)</div>
            <div class="value" id="attemptsKpi">—</div>
          </div>
          <div class="kpi">
            <div class="label">Chance coberta no gráfico</div>
            <div class="value" id="pmfCovKpi">—</div>
          </div>
        </div>

        <div class="materials">
          <div class="row" style="justify-content: space-between; margin-bottom: 8px;">
            <div class="pill">Materiais (estimado)</div>
          </div>
          <table>
            <thead>
              <tr><th>Material</th><th>Qtd</th></tr>
            </thead>
            <tbody id="materialsBody"></tbody>
          </table>
        </div>
      </div>

      <div class="card charts">
        <div>
          <div class="pill">Chances de levar X tentativas</div>
          <canvas id="pmfChart" height="120"></canvas>
        </div>
      </div>
    </div>
  </div>

  <script>
    const fmtFloat = (n) => new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 6 }).format(n);
    const fmtMoney = (n) => new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 0 }).format(n);
    const fmtCeilInt = (n) => new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 0 }).format(Math.ceil(n));

    let DATA = null;
    let pmfChart = null;

    function buildSeriesOptions() {
      const sel = document.getElementById('seriesSelect');
      sel.innerHTML = '';
      const keys = Object.keys(DATA.series).sort((a,b) => a.localeCompare(b));
      for (const k of keys) {
        const s = DATA.series[k];
        const opt = document.createElement('option');
        opt.value = k;
        // Mostra no formato simples, mas mantendo a info pra quem quiser.
        opt.textContent = `${s.group} (nível ${s.item_level})`;
        sel.appendChild(opt);
      }
    }

    function getSelection() {
      const seriesKey = document.getElementById('seriesSelect').value;
      const policy = document.getElementById('policySelect').value;
      const target = parseInt(document.getElementById('targetRange').value, 10);
      const start = parseInt(document.getElementById('startRange').value, 10);
      return { seriesKey, policy, target, start };
    }

    function updateTargetPill() {
      const t = document.getElementById('targetRange').value;
      document.getElementById('targetPill').textContent = `+${t}`;
    }

    function updateStartPill() {
      const s = document.getElementById('startRange').value;
      document.getElementById('startPill').textContent = `+${s}`;
    }

    function clampStartMax() {
      const target = parseInt(document.getElementById('targetRange').value, 10);
      const startRange = document.getElementById('startRange');
      const max = Math.max(0, target - 1);
      startRange.max = String(max);
      if (parseInt(startRange.value, 10) > max) {
        startRange.value = String(max);
      }
    }

    function getPolicySteps(seriesKey, policy) {
      // New JSON shape: policies[policy] has { policy_steps, from0 }
      return DATA.series[seriesKey].policies[policy].policy_steps;
    }

    function gaussianSolve(A, b) {
      const n = A.length;
      // augmented matrix
      const M = A.map((row, i) => row.slice().concat([b[i]]));
      for (let col = 0; col < n; col++) {
        // pivot
        let pivot = col;
        for (let r = col + 1; r < n; r++) {
          if (Math.abs(M[r][col]) > Math.abs(M[pivot][col])) pivot = r;
        }
        if (Math.abs(M[pivot][col]) < 1e-12) throw new Error('Sistema singular');
        if (pivot !== col) {
          const tmp = M[col]; M[col] = M[pivot]; M[pivot] = tmp;
        }
        // normalize
        const pv = M[col][col];
        for (let j = col; j <= n; j++) M[col][j] /= pv;
        // eliminate
        for (let r = 0; r < n; r++) {
          if (r === col) continue;
          const factor = M[r][col];
          if (Math.abs(factor) < 1e-15) continue;
          for (let j = col; j <= n; j++) M[r][j] -= factor * M[col][j];
        }
      }
      return M.map(row => row[n]);
    }

    function expectedTotalsXY(policySteps, start, target) {
      // states are 0..target, with target absorbing
      const n = target + 1;
      const solveReward = (kind, material) => {
        const A = Array.from({length: n}, () => Array(n).fill(0));
        const b = Array(n).fill(0);
        A[target][target] = 1;
        b[target] = 0;
        for (let s = 0; s < target; s++) {
          const step = policySteps[s]; // step for going s -> s+1 is refine_level = s+1 (0-based index)
          const p = step.rate_10000 / 10000.0;
          const breakp = step.breaking_rate_10000 / 10000.0;
          const qBreak = (1 - p) * breakp;
          const qNon = (1 - p) * (1 - breakp);
          const failState = step.downgrade_amount > 0 ? Math.max(0, s - step.downgrade_amount) : s;

          A[s][s] = 1;
          A[s][s + 1] -= p;
          A[s][0] -= qBreak;
          A[s][failState] -= qNon;

          if (kind === 'attempts') b[s] = 1;
          else if (kind === 'zeny') b[s] = step.zeny;
          else if (kind === 'material') b[s] = (step.material === material) ? 1 : 0;
          else throw new Error('reward inválido');
        }
        const sol = gaussianSolve(A, b);
        return sol[start];
      };

      const expAttempts = solveReward('attempts');
      const expZeny = solveReward('zeny');
      const mats = new Set();
      for (let i = start; i < target; i++) mats.add(policySteps[i].material);
      const expMaterials = {};
      Array.from(mats).sort().forEach(m => {
        expMaterials[m] = solveReward('material', m);
      });
      return { expAttempts, expZeny, expMaterials };
    }

    function attemptPmfXY(policySteps, start, target, eps = 1e-6, maxSteps = 200000) {
      const n = target + 1;
      let v = Array(n).fill(0);
      v[start] = 1;
      let absorbedPrev = 0;
      const pmf = [];
      for (let k = 1; k <= maxSteps; k++) {
        const vn = Array(n).fill(0);
        vn[target] += v[target];
        for (let s = 0; s < target; s++) {
          const mass = v[s];
          if (!mass) continue;
          const step = policySteps[s];
          const p = step.rate_10000 / 10000.0;
          const breakp = step.breaking_rate_10000 / 10000.0;
          const qBreak = (1 - p) * breakp;
          const qNon = (1 - p) * (1 - breakp);
          const failState = step.downgrade_amount > 0 ? Math.max(0, s - step.downgrade_amount) : s;
          vn[s + 1] += mass * p;
          vn[0] += mass * qBreak;
          vn[failState] += mass * qNon;
        }
        v = vn;
        const absorbed = v[target];
        pmf.push(absorbed - absorbedPrev);
        absorbedPrev = absorbed;
        if (1 - absorbed < eps) break;
      }
      // normalize drift
      const sum = pmf.reduce((a,b) => a+b, 0);
      if (sum > 0) pmf[pmf.length - 1] += (1 - sum);
      return pmf;
    }

    function updateKpisMaterials() {
      const { seriesKey, policy, target, start } = getSelection();
      const policySteps = getPolicySteps(seriesKey, policy);

      if (start >= target) {
        document.getElementById('zenyKpi').textContent = '0';
        document.getElementById('attemptsKpi').textContent = '0';
        document.getElementById('pmfCovKpi').textContent = '1';
        document.getElementById('materialsBody').innerHTML = '';
        return;
      }

      const totals = expectedTotalsXY(policySteps, start, target);
      const pmf = attemptPmfXY(policySteps, start, target, DATA.meta.pmf_eps);
      const cov = pmf.reduce((a,b) => a+b, 0);

      document.getElementById('zenyKpi').textContent = fmtCeilInt(totals.expZeny);
      document.getElementById('attemptsKpi').textContent = fmtCeilInt(totals.expAttempts);
      document.getElementById('pmfCovKpi').textContent = fmtFloat(cov);

      const tbody = document.getElementById('materialsBody');
      tbody.innerHTML = '';
      const entries = Object.entries(totals.expMaterials).sort((a,b) => a[0].localeCompare(b[0]));
      for (const [mat, cnt] of entries) {
        const tr = document.createElement('tr');
        const td1 = document.createElement('td');
        const td2 = document.createElement('td');
        td1.textContent = mat;
        td2.textContent = fmtCeilInt(cnt);
        tr.appendChild(td1);
        tr.appendChild(td2);
        tbody.appendChild(tr);
      }
    }

    function updatePmfChart() {
      const { seriesKey, policy, target, start } = getSelection();
      const policySteps = getPolicySteps(seriesKey, policy);
      const pmf = (start >= target) ? [1.0] : attemptPmfXY(policySteps, start, target, DATA.meta.pmf_eps);
      const labels = pmf.map((_, i) => String(i+1));

      // Stats from PMF: mode, mean, median, p75, p90 (k is 1-based attempts)
      const pmfSum = pmf.reduce((a,b) => a+b, 0);
      const pmfNorm = pmfSum > 0 ? pmf.map(x => x / pmfSum) : pmf.slice();

      let modeK = 1;
      let modeP = pmfNorm[0] ?? 0;
      for (let i = 0; i < pmfNorm.length; i++) {
        if (pmfNorm[i] > modeP) {
          modeP = pmfNorm[i];
          modeK = i + 1;
        }
      }

      let mean = 0;
      for (let i = 0; i < pmfNorm.length; i++) mean += (i + 1) * pmfNorm[i];

      const quantileK = (q) => {
        let c = 0;
        for (let i = 0; i < pmfNorm.length; i++) {
          c += pmfNorm[i];
          if (c >= q) return i + 1;
        }
        return pmfNorm.length;
      };

      const medianK = quantileK(0.5);
      const p75K = quantileK(0.75);
      const p90K = quantileK(0.90);

      const meanCeil = Math.ceil(mean);
      const vlines = [
        { k: modeK, label: `Mais comum: ${modeK}`, color: 'rgba(52, 211, 153, 0.90)' },
        { k: Math.max(1, Math.min(pmfNorm.length, meanCeil)), label: `Média: ${meanCeil}`, color: 'rgba(122, 162, 255, 0.90)' },
        { k: medianK, label: `Metade dos casos: ${medianK}`, color: 'rgba(179, 136, 255, 0.90)' },
        { k: p75K, label: `75% até: ${p75K}`, color: 'rgba(251, 191, 36, 0.90)' },
        { k: p90K, label: `90% até: ${p90K}`, color: 'rgba(244, 114, 182, 0.90)' },
      ];

      const ctx = document.getElementById('pmfChart');
      if (pmfChart) pmfChart.destroy();
      pmfChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels,
          datasets: [
            { label: 'P(T = k)', data: pmf, backgroundColor: 'rgba(122,162,255,0.35)', borderColor: 'rgba(122,162,255,0.8)', borderWidth: 1 }
          ]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { labels: { color: '#e7ecff' } },
            tooltip: { callbacks: { label: (ctx) => ` P(T=${ctx.label}) = ${fmtFloat(ctx.raw)}` } },
            refineStatsVLines: { lines: vlines }
          },
          scales: {
            x: { ticks: { color: '#aab3d6', maxTicksLimit: 16 }, grid: { color: 'rgba(255,255,255,0.06)' }, title: { display: true, text: 'tentativas', color: '#aab3d6' } },
            y: { ticks: { color: '#aab3d6' }, grid: { color: 'rgba(255,255,255,0.06)' }, title: { display: true, text: 'Probabilidade', color: '#aab3d6' } }
          }
        },
        plugins: [{
          id: 'refineStatsVLines',
          afterDatasetsDraw(chart, _args, pluginOptions) {
            const lines = pluginOptions?.lines || [];
            if (!lines.length) return;

            const { ctx, chartArea, scales } = chart;
            const xScale = scales.x;
            if (!xScale) return;

            ctx.save();
            ctx.font = '12px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial';
            ctx.textBaseline = 'middle';

            // stack labels vertically to avoid overlap
            const y0 = chartArea.top + 12;
            const dy = 14;
            let slot = 0;

            for (const ln of lines) {
              const k = ln.k;
              if (!k || k < 1) continue;
              const label = ln.label || String(k);
              const color = ln.color || 'rgba(255,255,255,0.8)';

              const x = xScale.getPixelForValue(String(k));
              if (!Number.isFinite(x)) continue;
              if (x < chartArea.left || x > chartArea.right) continue;

              // vertical line
              ctx.strokeStyle = color;
              ctx.lineWidth = 1;
              ctx.beginPath();
              ctx.moveTo(x, chartArea.top);
              ctx.lineTo(x, chartArea.bottom);
              ctx.stroke();

              // label with small background
              const y = y0 + (slot % 6) * dy;
              slot++;

              const padX = 6;
              const padY = 4;
              const textW = ctx.measureText(label).width;
              const boxW = textW + padX * 2;
              const boxH = 16;
              let bx = x + 6;
              if (bx + boxW > chartArea.right) bx = x - 6 - boxW;
              const by = y - boxH / 2;

              ctx.fillStyle = 'rgba(0,0,0,0.55)';
              ctx.strokeStyle = 'rgba(255,255,255,0.12)';
              ctx.lineWidth = 1;
              // rounded rect
              const r = 6;
              ctx.beginPath();
              ctx.moveTo(bx + r, by);
              ctx.arcTo(bx + boxW, by, bx + boxW, by + boxH, r);
              ctx.arcTo(bx + boxW, by + boxH, bx, by + boxH, r);
              ctx.arcTo(bx, by + boxH, bx, by, r);
              ctx.arcTo(bx, by, bx + boxW, by, r);
              ctx.closePath();
              ctx.fill();
              ctx.stroke();

              ctx.fillStyle = color;
              ctx.fillText(label, bx + padX, y);
            }

            ctx.restore();
          }
        }]
      });
    }

    function refreshAll() {
      clampStartMax();
      updateTargetPill();
      updateStartPill();
      updateKpisMaterials();
      updatePmfChart();
    }

    async function main() {
      // Load data from JSON file
      const res = await fetch('./refine_report_data.json', { cache: 'no-store' });
      DATA = await res.json();

      buildSeriesOptions();
      refreshAll();

      document.getElementById('seriesSelect').addEventListener('change', refreshAll);
      document.getElementById('policySelect').addEventListener('change', refreshAll);
      document.getElementById('targetRange').addEventListener('input', () => {
        clampStartMax();
        updateTargetPill();
        updateKpisMaterials();
        updatePmfChart();
      });
      document.getElementById('startRange').addEventListener('input', () => {
        updateStartPill();
        updateKpisMaterials();
        updatePmfChart();
      });
    }

    main().catch(err => {
      console.error(err);
      alert('Não deu pra carregar os dados. Verifique se o arquivo refine_report_data.json está disponível.');
    });
  </script>
</body>
</html>
